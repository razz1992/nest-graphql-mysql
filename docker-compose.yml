name: nest-graphql-mysql

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nest-graphql-mysql:local
    container_name: nest-graphql-mysql
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      NODE_ENV: production
      PORT: "8085"
      MYSQL_DB_PASSWORD_FILE: /run/secrets/mysql_db_password
      MYSQL_SSL_CA_PATH: /run/mysql-ca/mysql-ca.pem
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:8085:8085"
    secrets:
      - mysql_db_password
    volumes:
      - ./certs/mysql-ca.pem:/run/mysql-ca/mysql-ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8085/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  mysql_db_password:
    file: ./secrets/mysql_db_password
